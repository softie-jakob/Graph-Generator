<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Binary 3D Bar Chart Generator</title>

<style>
body{
    background:#0d4df2;
    color:white;
    font-family:Arial,sans-serif;
    padding:40px;
}

textarea{
    width:400px;
    height:120px;
}

button{
    padding:10px 20px;
    margin-top:10px;
}

svg{
    margin-top:30px;
    background:#0d4df2;
}
</style>
</head>
<body>

<h2>Binary 3D Bar Generator</h2>

<p>Werte eingeben (Komma getrennt)</p>

<textarea id="data">40,65,80,100</textarea>
<br>
<button onclick="generate()">Generate</button>

<br>

<svg id="chart" width="1200" height="700"></svg>

<script>

function generate(){

    let values =
        document.getElementById("data")
        .value
        .split(",")
        .map(v=>Number(v.trim()));

    let svg = document.getElementById("chart");
    svg.innerHTML = "";

    const barWidth = 120;
    const spacing = 80;

    const depthX = 35;
    const depthY = -20;

    values.forEach((value,index)=>{

        let x = 140 + index*(barWidth+spacing);
        let y = 600;
        let height = value * 4;

        drawBinaryBar(svg,x,y,height,barWidth,depthX,depthY);

    });
}

function drawBinaryBar(svg,x,y,height,width,dx,dy){

    const cols = 18;
    const rows = Math.floor(height/8);

    const cellX = width/cols;
    const cellY = height/rows;

    /* FRONT */

    for(let r=0;r<rows;r++){

        for(let c=0;c<cols;c++){

            let bit = Math.random() > 0.5 ? "1":"0";

            let tx = x + c*cellX;
            let ty = y - height + r*cellY;

            let t =
            document.createElementNS(
            "http://www.w3.org/2000/svg",
            "text");

            t.setAttribute("x",tx);
            t.setAttribute("y",ty);

            t.setAttribute("font-size","9");
            t.setAttribute("fill","white");
            t.setAttribute("font-family","monospace");

            t.textContent = bit;

            svg.appendChild(t);
        }
    }

    /* TOP FACE */

    for(let c=0;c<cols;c++){

        for(let d=0;d<6;d++){

            let bit = Math.random() > 0.5 ? "1":"0";

            let tx =
                x +
                c*cellX +
                d*dx/6;

            let ty =
                y-height +
                d*dy/6;

            let t =
            document.createElementNS(
            "http://www.w3.org/2000/svg",
            "text");

            t.setAttribute("x",tx);
            t.setAttribute("y",ty);
            t.setAttribute("font-size","8");
            t.setAttribute("fill","#dbe5ff");
            t.setAttribute("font-family","monospace");

            t.textContent=bit;

            svg.appendChild(t);
        }
    }

    /* SIDE FACE */

    for(let r=0;r<rows;r++){

        for(let d=0;d<6;d++){

            let bit = Math.random() > 0.5 ? "1":"0";

            let tx =
                x + width +
                d*dx/6;

            let ty =
                y-height +
                r*cellY +
                d*dy/6;

            let t =
            document.createElementNS(
            "http://www.w3.org/2000/svg",
            "text");

            t.setAttribute("x",tx);
            t.setAttribute("y",ty);
            t.setAttribute("font-size","8");
            t.setAttribute("fill","#b7c9ff");
            t.setAttribute("font-family","monospace");

            t.textContent=bit;

            svg.appendChild(t);
        }
    }
}

generate();

</script>

</body>
</html>
