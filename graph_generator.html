<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Binary 3D Diagramm-Generator</title>
<style>
body { background:#000; color:white; font-family:Arial,sans-serif; padding:40px; margin:0; }
textarea { width:min(400px,100%); height:120px; box-sizing:border-box; display:block; margin:8px 0 12px; padding:10px; font:16px monospace; }
button { padding:10px 20px; margin:0 8px 10px 0; border:1px solid white; border-radius:6px; background:#111; color:white; cursor:pointer; }
button.active, button:hover { background:#0d4df2; }
svg { display:block; max-width:100%; height:auto; margin-top:30px; background:#000; }
.error { color:#ffb3b3; min-height:1.2em; }
.language-switch { margin-bottom:20px; }
.chart-controls { display:flex; flex-wrap:wrap; align-items:flex-start; gap:0 24px; }
.chart-type-controls, .export-controls { display:flex; flex-wrap:wrap; }
.export-controls { border-left:1px solid #555; padding-left:24px; }
@media (max-width:600px) {
    .export-controls { border-left:0; padding-left:0; width:100%; }
}
</style>
</head>
<body>
<div class="language-switch" aria-label="Language / Sprache">
<button id="deButton" onclick="setLanguage('de')">Deutsch</button>
<button id="enButton" onclick="setLanguage('en')">English</button>
</div>
<h2 id="title">Binary 3D Diagramm-Generator</h2>
<p id="valuesDescription">Werte eingeben (Komma getrennt)</p>
<textarea id="data">40,65,80,100</textarea>
<p id="labelsDescription">Beschriftungen eingeben (Komma getrennt)</p>
<textarea id="labels">A,B,C,D</textarea>
<div class="chart-controls">
<div class="chart-type-controls">
<button id="barsButton" onclick="setChartType('bars')">Balkendiagramm</button>
<button id="columnsButton" onclick="setChartType('columns')">Säulendiagramm</button>
</div>
<div class="export-controls">
<button id="exportButton" onclick="exportChart()">SVG exportieren</button>
</div>
</div>
<p id="error" class="error" role="alert"></p>
<svg id="chart" width="1400" height="700" viewBox="0 0 1400 700"></svg>
<script>
let chartType = "columns";
let language = "de";

const translations = {
    de: {
        title: "Binary 3D Diagramm-Generator",
        valuesDescription: "Werte eingeben (Komma getrennt)",
        labelsDescription: "Beschriftungen eingeben (Komma getrennt)",
        bars: "Balkendiagramm",
        columns: "Säulendiagramm",
        export: "SVG exportieren",
        error: "Bitte nur positive Zahlen eingeben."
    },
    en: {
        title: "Binary 3D Chart Generator",
        valuesDescription: "Enter values (comma separated)",
        labelsDescription: "Enter labels (comma separated)",
        bars: "Bar chart",
        columns: "Column chart",
        export: "Export SVG",
        error: "Please enter positive numbers only."
    }
};

function setLanguage(nextLanguage) {
    language = nextLanguage;
    const text = translations[language];
    document.documentElement.lang = language;
    document.title = text.title;
    document.getElementById("title").textContent = text.title;
    document.getElementById("valuesDescription").textContent = text.valuesDescription;
    document.getElementById("labelsDescription").textContent = text.labelsDescription;
    document.getElementById("barsButton").textContent = text.bars;
    document.getElementById("columnsButton").textContent = text.columns;
    document.getElementById("exportButton").textContent = text.export;
    document.getElementById("deButton").classList.toggle("active", language === "de");
    document.getElementById("enButton").classList.toggle("active", language === "en");
    if (document.getElementById("error").textContent) {
        document.getElementById("error").textContent = text.error;
    }
}

function generate() {
    const values = document.getElementById("data").value.split(",").map(value => Number(value.trim()));
    const labels = document.getElementById("labels").value.split(",").map(label => label.trim());
    const error = document.getElementById("error");
    if (!values.length || values.some(value => !Number.isFinite(value) || value < 0)) {
        error.textContent = translations[language].error;
        return;
    }
    error.textContent = "";
    const svg = document.getElementById("chart");
    svg.innerHTML = "";
    if (chartType === "bars") drawBars(svg, values, labels);
    else drawColumns(svg, values, labels);
}

function setChartType(type) {
    chartType = type;
    document.getElementById("barsButton").classList.toggle("active", type === "bars");
    document.getElementById("columnsButton").classList.toggle("active", type === "columns");
    generate();
}

function svgText(svg, x, y, text, size, opacity = 1) {
    const node = document.createElementNS("http://www.w3.org/2000/svg", "text");
    node.setAttribute("x", x); node.setAttribute("y", y);
    node.setAttribute("font-size", size); node.setAttribute("fill", "white");
    node.setAttribute("font-family", "IBM Plex Mono, monospace");
    node.setAttribute("opacity", opacity); node.textContent = text; svg.appendChild(node);
}

function drawBars(svg, values, labels) {
    const maxValue = Math.max(...values, 1), barHeight = 50, spacing = 40;
    values.forEach((value, index) => {
        const y = 80 + index * (barHeight + spacing), width = value / maxValue * 800;
        const digit = [".", ",", "*", "#", "@"][index % 5];
        svgText(svg, 20, y + 32, labels[index] || String(index + 1), 20);
        svgText(svg, 120 + width + 50, y + 32, String(value), 28);
        drawFace(svg, 115, y, width, barHeight, digit, 60, 5,1);
        drawTop(svg, 120, y, width, digit, 25, -15, 4);
        drawSide(svg, 112, y, width, barHeight, digit, 25, -15, 4);
    });
}

function drawColumns(svg, values, labels) {
    const maxValue = Math.max(...values, 1), chartHeight = 500, barWidth = 110, spacing = 70;
    values.forEach((value, index) => {
        const x = 120 + index * (barWidth + spacing), height = value / maxValue * chartHeight, y = 600 - height;
        const digit = index % 2 === 0 ? "0" : "1";
        svgText(svg, x + 35, 640, labels[index] || String(index + 1), 20);
        drawFace(svg, x, y, barWidth, height, digit, 12, Math.max(1, Math.floor(height / 14)), 1);
        drawTop(svg, 5 + x, 5+y, barWidth, digit, 35, -24, 5);
        drawSide(svg, x, y, barWidth, height, digit, 35, -24, 5);
    });
}

function drawFace(svg, x, y, width, height, digit, cols, rows, opacity) {
    const cellX = width / cols, cellY = height / rows;
    for (let row = 0; row < rows; row++) for (let col = 0; col < cols; col++) {
        svgText(svg, x + col * cellX, y + 14 + row * cellY, digit, 11, opacity);
    }
}

function drawTop(svg, x, y, width, digit, dx, dy, rows) {
    const cols = Math.max(1, Math.floor(width / 12));
    for (let row = 0; row < rows; row++) for (let col = 0; col < cols; col++) {
        svgText(svg, x + col * (width / cols) + row * dx / rows, y + row * dy / rows, digit, 10, 0.8);
    }
}

function drawSide(svg, x, y, width, height, digit, dx, dy, cols) {
    const rows = Math.max(1, Math.floor(height / 14));
    for (let row = 0; row < rows; row++) for (let col = 0; col < cols; col++) {
        svgText(svg, x + width + col * dx / cols, y + 14 + row * (height / rows) + col * dy / cols, digit, 10, 0.55);
    }
}

function exportChart() {
    generate();
    if (document.getElementById("error").textContent) return;
    const svgData = new XMLSerializer().serializeToString(document.getElementById("chart"));
    const blob = new Blob([svgData], { type: "image/svg+xml;charset=utf-8" });
    const url = URL.createObjectURL(blob), now = new Date();
    const timestamp = now.toISOString().replace(/T/, "_").replace(/:/g, "-").replace(/\.\d{3}Z$/, "");
    const name = chartType === "bars" ? "balkendiagramm" : "saeulendiagramm";
    const link = document.createElement("a");
    link.href = url; link.download = `${name}_${timestamp}.svg`; link.click(); URL.revokeObjectURL(url);
}

setLanguage("de");
setChartType("bars");
document.getElementById("data").addEventListener("input", generate);
document.getElementById("labels").addEventListener("input", generate);
</script>
</body>
</html>
